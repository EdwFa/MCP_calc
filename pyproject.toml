[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-calc"
version = "0.1.0"
description = "MCP-сервер учебных медицинских калькуляторов и Streamlit-демо."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "pydantic>=2",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-calc = "mcp_calc.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
